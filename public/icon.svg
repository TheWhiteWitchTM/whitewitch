<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- Background circle (optional subtle face base - can remove if you want pure lines) -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="#000" stroke-width="3"/>

    <!-- Green hair - simple wavy top with currentColor fallback -->
    <path
            d="M20 30 Q30 10 50 10 Q70 10 80 30 Q85 50 80 70 Q70 90 50 90 Q30 90 20 70 Q15 50 20 30 Z"
            fill="#22c55e"  <!-- green-500-ish, adjust as needed -->
    stroke="#000" stroke-width="3"
    />

    <!-- Hair strands / fringe for emoji feel -->
    <path d="M35 15 Q40 5 45 15" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
    <path d="M55 15 Q60 5 65 15" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>

    <!-- Face outline (minimal) -->
    <circle cx="50" cy="55" r="28" fill="none" stroke="#000" stroke-width="4"/>

    <!-- Eyes - simple dots -->
    <circle cx="40" cy="50" r="5" fill="#000"/>
    <circle cx="60" cy="50" r="5" fill="#000"/>

    <!-- Mouth - small smile -->
    <path d="M40 65 Q50 75 60 65" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
</svg>