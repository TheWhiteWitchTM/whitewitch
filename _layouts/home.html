<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}" prefix="og: http://ogp.me/ns#">
  <head>
    {% include head-custom.html %}
  </head>
  <body>
    {% include nav.html %}

    <!-- Banner outside the constrained column -->
    <img src="{{ '/assets/images/banner.jpg?v=' | append: site.github.build_revision | relative_url }}" alt="The White Witch banner. Mira on the left, the witch on the right." width="1200" height="400" class="site-banner">

    <div class="page-frame">
      {% include sides.html where="left" %}

      <main class="home-content markdown-body">
        {{ content }}
      </main>

      {% include sides.html where="right" %}
    </div>

    {% include footer.html %}
    {% include scripts.html %}
    {% include home-scripts.html %}
    {% include post-scripts.html %}
  </body>
</html>
