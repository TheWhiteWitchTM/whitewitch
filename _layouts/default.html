<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}" prefix="og: http://ogp.me/ns#">
  <head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧙‍♀️</text></svg>">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | default: site.title | default: "The White Witch™" }}</title>
    <meta name="description" content="{{ page.description | default: site.description | default: "Politics and social events. Facts & data first. I want you smarter, not recruited." }}">

    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | default: site.title | default: "The White Witch™" }}">
    <meta property="og:description" content="{{ page.description | default: site.description | default: "Politics and social events. Facts & data first. I want you smarter, not recruited." }}">
    <meta property="og:image" content="https://pbs.twimg.com/media/HUNMWkbWUAE7b5d.jpg">
    <meta property="og:site_name" content="The White Witch™">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@TheWhiteWitchTM">
    <meta name="twitter:title" content="{{ page.title | default: site.title | default: "The White Witch™" }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | default: "Politics and social events. Facts & data first. I want you smarter, not recruited." }}">
    <meta name="twitter:image" content="https://pbs.twimg.com/media/HUNMWkbWUAE7b5d.jpg">

    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    {% include nav.html %}

    <main class="page-frame">
      <div class="side-image left">
        <img src="{{ '/assets/images/mira.jpg' | relative_url }}" alt="Mira">
      </div>

      <div class="content-area home-content markdown-body">
        {{ content }}
      </div>

      <div class="side-image right">
        <img src="{{ '/assets/images/witch.jpg' | relative_url }}" alt="Witch">
      </div>
    </main>

    {% include footer.html %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
    <script>
      document.querySelectorAll('.dropdown-toggle').forEach(toggle => {
        toggle.addEventListener('click', function(e) {
          e.preventDefault();
          const menu = this.nextElementSibling;
          const isOpen = menu.classList.contains('open');
          document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
          if (!isOpen) menu.classList.add('open');
        });
      });
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.dropdown')) {
          document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
        }
      });
    </script>
    <script>
      const toggle = document.querySelector('.nav-toggle');
      const menu = document.querySelector('.site-nav > ul');
      if (toggle && menu) {
        toggle.addEventListener('click', () => {
          menu.classList.toggle('open');
        });
      }
    </script>

    <script>
    document.querySelectorAll('.post-item').forEach(item => {
      const title = item.querySelector('.toggle-title');
      const emoji = item.querySelector('.toggle-emoji');
      const expandBtn = item.querySelector('.expand-btn');
      const excerpt = item.querySelector('.excerpt');
      const full = item.querySelector('.full-content');
      const url = item.dataset.url;

      if (!title || !expandBtn) return;

      const collapse = () => {
        full.setAttribute('hidden', '');
        if (excerpt) excerpt.classList.remove('hidden');
        expandBtn.innerHTML = '▼ Show more';
        if (emoji) emoji.textContent = '▼';
      };

      const expand = async () => {
        if (!full.dataset.loaded) {
          expandBtn.textContent = 'Loading…';
          try {
            const res = await fetch(url);
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const content = doc.querySelector('.content-area') || doc.querySelector('main');
            const back = content.querySelector('a[href*="blog"], a[href*="politics"]');
            if (back) back.closest('p')?.remove() || back.remove();
            full.innerHTML = content.innerHTML;
            full.dataset.loaded = 'true';
          } catch (e) {
            full.innerHTML = '<p>Could not load post.</p>';
          }
        }
        full.removeAttribute('hidden');
        if (excerpt) excerpt.classList.add('hidden');
        expandBtn.innerHTML = '▲ Show less';
        if (emoji) emoji.textContent = '▲';
      };

      const toggleExpand = () => {
        if (full.hasAttribute('hidden')) expand();
        else collapse();
      };

      title.addEventListener('click', toggleExpand);
      expandBtn.addEventListener('click', toggleExpand);
    });
    </script>
  </body>
</html>
