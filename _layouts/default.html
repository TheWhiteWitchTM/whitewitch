<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | default: site.title | default: "The White Witch™" }}</title>
    <meta name="description" content="{{ page.description | default: site.description | default: "Politics and social events. Facts & data first. I want you smarter, not recruited." }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | default: site.title | default: "The White Witch™" }}">
    <meta property="og:description" content="{{ page.description | default: site.description | default: "Politics and social events. Facts & data first. I want you smarter, not recruited." }}">
    <meta property="og:image" content="https://pbs.twimg.com/media/HUNMWkbWUAE7b5d.jpg">
    <meta property="og:site_name" content="The White Witch™">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@TheWhiteWitchTM">
    <meta name="twitter:title" content="{{ page.title | default: site.title | default: "The White Witch™" }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | default: "Politics and social events. Facts & data first. I want you smarter, not recruited." }}">
    <meta name="twitter:image" content="https://pbs.twimg.com/media/HUNMWkbWUAE7b5d.jpg">

    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}

    <style>
      .page-frame {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 1.5rem;
        max-width: 1400px;
        margin: 0 auto;
        padding: 1rem 1rem 3rem;
      }

      .side-image {
        flex: 0 0 160px;
        position: sticky;
        top: 1.5rem;
        z-index: 1;
      }

      .side-image img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      }

      .content-area {
        flex: 1 1 720px;
        min-width: 0;
        max-width: 900px;
      }

      @media (max-width: 900px) {
        .page-frame {
          flex-direction: column;
          align-items: center;
        }
        .side-image {
          flex: 0 0 auto;
          width: 140px;
          position: static;
        }
        .side-image.left { order: 1; }
        .content-area { order: 2; }
        .side-image.right { order: 3; }
      }
    </style>
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">

      <!-- Dropdown navigation (unchanged) -->
      <nav class="site-nav">
        <ul>
          <li><a href="/whitewitch/">🏠 Home</a></li>
          <li class="dropdown">
            <a href="#">📜 Content</a>
            <ul class="dropdown-menu">
              <li><a href="/whitewitch/about">About</a></li>
              <li><a href="/whitewitch/videos">Videos</a></li>
              <li><a href="/whitewitch/blog">Blog</a></li>
            </ul>
          </li>
          <li><a href="/whitewitch/downloads">📥 Downloads</a></li>
          <li><a href="/whitewitch/about">🔮 About</a></li>
          <li><a href="https://x.com/TheWhiteWitchTM">✖️ X</a></li>
        </ul>
      </nav>

      <!-- Mira left, content center, Witch right -->
      <div class="page-frame">
        <div class="side-image left">
          <img src="{{ '/assets/images/mira.jpg' | relative_url }}" alt="Mira">
        </div>

        <div class="content-area">
          {{ content }}
        </div>

        <div class="side-image right">
          <img src="{{ '/assets/images/witch.jpg' | relative_url }}" alt="Witch">
        </div>
      </div>

      {% if site.github.private != true and site.github.license %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
