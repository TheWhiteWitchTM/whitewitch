<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}" prefix="og: http://ogp.me/ns#">
  <head>
    {% include head-custom.html %}
  </head>
  <body>
    {% include nav.html %}

    <main class="page-frame">
      {% include sides.html where="left" %}

      <div class="content-area home-content markdown-body">
        {{ content }}

        {% if page.collection %}
          {% include post-actions.html %}
        {% endif %}
      </div>

      {% include sides.html where="right" %}
    </main>

    {% include footer.html %}
    {% include scripts.html %}
    {% include post-scripts.html %}
  </body>
</html>
