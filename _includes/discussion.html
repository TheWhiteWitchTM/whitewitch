<button class="discussion-btn" type="button">Show discussion</button>
<div class="giscus-container" hidden></div>

<script>
(function() {
  const btn = document.currentScript.previousElementSibling.previousElementSibling;
  const container = document.currentScript.previousElementSibling;

  btn.addEventListener('click', () => {
    if (container.hasAttribute('hidden')) {
      if (!container.dataset.loaded) {
        btn.textContent = 'Loading…';
        const script = document.createElement('script');
        script.src = 'https://giscus.app/client.js';
        script.setAttribute('data-repo', 'TheWhiteWitchTM/whitewitch');
        script.setAttribute('data-repo-id', 'YOUR_REPO_ID');
        script.setAttribute('data-category', 'YOUR_CATEGORY');
        script.setAttribute('data-category-id', 'YOUR_CATEGORY_ID');
        script.setAttribute('data-mapping', 'pathname');
        script.setAttribute('data-strict', '0');
        script.setAttribute('data-reactions-enabled', '1');
        script.setAttribute('data-emit-metadata', '0');
        script.setAttribute('data-input-position', 'bottom');
        script.setAttribute('data-theme', 'dark');
        script.setAttribute('data-lang', 'en');
        script.setAttribute('data-loading', 'lazy');
        script.crossOrigin = 'anonymous';
        script.async = true;
        container.appendChild(script);
        container.dataset.loaded = 'true';
      }
      container.removeAttribute('hidden');
      btn.textContent = 'Hide discussion';
    } else {
      container.setAttribute('hidden', '');
      btn.textContent = 'Show discussion';
    }
  });
})();
</script>
