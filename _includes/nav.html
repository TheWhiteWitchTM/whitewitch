<header class="site-header">
  <nav class="site-nav">
    <p style="color: #c9a6ff;">
      DEBUG: nav data = {{ site.data.nav | jsonify }}
    </p>
    <ul>
      {% for item in site.data.nav.items %}
        <li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
