<script>
  const banner = document.querySelector('.site-banner');
  const sides = document.querySelectorAll('.side-image');

  if (banner && sides.length) {
    const place = () => {
      const bottom = banner.getBoundingClientRect().bottom;
      const gone = bottom < window.innerHeight * 0.42;
      sides.forEach(side => side.classList.toggle('hidden', !gone));
    };
    place();
    window.addEventListener('scroll', place, { passive: true });
    window.addEventListener('resize', place);
  }
</script>
