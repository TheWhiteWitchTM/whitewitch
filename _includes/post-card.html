<article class="post-item" data-url="{{ include.post.url | relative_url }}">
  <h2 class="toggle-title">
    <span class="toggle-emoji" title="Expand / collapse">▼</span>
    <span class="title-text">{{ include.post.title }}</span>
  </h2>

  <div class="excerpt">
    {{ include.post.content | strip_html | truncate: 300 }}
  </div>

  {% if include.post.video %}
    {% assign yt_id = include.post.video | split: "/" | last | split: "?" | first | replace: "watch?v=", "" | replace: "youtu.be/", "" %}
    <div class="post-media">
      <iframe width="100%" height="315" src="https://www.youtube.com/embed/{{ yt_id }}" frameborder="0" allowfullscreen loading="lazy"></iframe>
    </div>
  {% elsif include.post.image %}
    <img src="{{ include.post.image | relative_url }}" alt="" class="post-image" loading="lazy">
  {% endif %}

  <div class="full-content" hidden></div>

  <div class="button-row">
    <button class="btn btn-outline expand-btn" type="button" title="Expand / collapse">▼ Show more</button>
    <button class="btn btn-outline share-btn" type="button" title="Copy link" data-url="{{ include.post.url | absolute_url }}">📋 Share</button>
    <button class="btn btn-outline discussion-btn" type="button" title="Toggle discussion">💬 Discussion</button>
  </div>

  <div class="giscus-container" hidden></div>

  <script>
  (function() {
    const article = document.currentScript.closest('article');
    const btn = article.querySelector('.discussion-btn');
    const container = article.querySelector('.giscus-container');

    if (!btn || !container) return;

    btn.addEventListener('click', () => {
      if (container.hasAttribute('hidden')) {
        if (!container.dataset.loaded) {
          btn.textContent = 'Loading…';
          const script = document.createElement('script');
          script.src = 'https://giscus.app/client.js';
          script.setAttribute('data-repo', '{{ site.data.giscus.repo | default: "TheWhiteWitchTM/whitewitch" }}');
          script.setAttribute('data-repo-id', '{{ site.data.giscus.repo_id }}');
          script.setAttribute('data-category', '{{ site.data.giscus.category }}');
          script.setAttribute('data-category-id', '{{ site.data.giscus.category_id }}');
          script.setAttribute('data-mapping', 'pathname');
          script.setAttribute('data-theme', 'dark');
          script.setAttribute('data-lang', 'en');
          script.crossOrigin = 'anonymous';
          script.async = true;
          container.appendChild(script);
          container.dataset.loaded = 'true';
        }
        container.removeAttribute('hidden');
        btn.innerHTML = '💬 Discussion off';
      } else {
        container.setAttribute('hidden', '');
        btn.innerHTML = '💬 Discussion';
      }
    });
  })();
  </script>
</article>
