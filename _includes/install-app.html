<div id="install-app" class="install-app" role="region" aria-label="Open as app">
  <img src="{{ '/assets/icons/icon-192.png' | relative_url }}" alt="" width="44" height="44">
  <div class="install-app-copy">
    <strong>Open as app</strong>
    <span id="install-app-note">The White Witch, in its own window.</span>
  </div>
  <button type="button" class="btn btn-primary" id="install-app-open">Open as app</button>
  <button type="button" class="install-app-dismiss" id="install-app-dismiss" aria-label="Not now">×</button>
</div>
<script>
  (function () {
    var root = document.getElementById('install-app');
    if (!root) return;

    var openBtn = document.getElementById('install-app-open');
    var dismissBtn = document.getElementById('install-app-dismiss');
    var note = document.getElementById('install-app-note');

    function installed() {
      return window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || window.matchMedia('(display-mode: minimal-ui)').matches
        || window.navigator.standalone === true;
    }

    function dismissed() {
      try { return localStorage.getItem('ww-install-dismissed') === '1'; }
      catch (err) { return false; }
    }

    if (installed() || dismissed()) return;

    function show() { root.hidden = false; }
    function hide() { root.hidden = true; }

    function arm() {
      if (window.__wwInstallPrompt) show();
    }

    window.addEventListener('ww-installable', arm);
    arm();

    if (openBtn) {
      openBtn.addEventListener('click', function () {
        var promptEvent = window.__wwInstallPrompt;
        if (!promptEvent) {
          if (note) note.textContent = 'One more click. Chrome is still getting the install ready.';
          return;
        }
        window.__wwInstallPrompt = null;
        var choice = promptEvent.userChoice;
        try { promptEvent.prompt(); }
        catch (err) { hide(); return; }
        Promise.resolve(choice).then(hide, hide);
      });
    }

    window.addEventListener('appinstalled', function () {
      window.__wwInstallPrompt = null;
      hide();
    });

    if (dismissBtn) {
      dismissBtn.addEventListener('click', function () {
        hide();
        document.documentElement.classList.add('ww-install-off');
        try { localStorage.setItem('ww-install-dismissed', '1'); }
        catch (err) {}
      });
    }

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !root.hidden) {
        hide();
        document.documentElement.classList.add('ww-install-off');
        try { localStorage.setItem('ww-install-dismissed', '1'); }
        catch (err) {}
      }
    });

    var ua = window.navigator.userAgent || '';
    var ios = /iphone|ipad|ipod/i.test(ua)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var firefox = /firefox/i.test(ua) && !/seamonkey/i.test(ua);
    if (ios) {
      if (openBtn) openBtn.hidden = true;
      if (note) note.textContent = 'Tap Share, then Add to Home Screen.';
      show();
    } else if (!firefox) {
      // Chrome draws the address-bar Install icon before it fires
      // beforeinstallprompt. Show our bar as soon as the page is open.
      show();
    }
  })();
</script>
