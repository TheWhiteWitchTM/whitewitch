{% if page.collection %}
  <div class="button-row" style="margin-top: 2rem;">
    <a href="javascript:history.back()" class="btn btn-outline">← Back</a>
    <button class="btn btn-outline share-btn" type="button" data-url="{{ page.url | absolute_url }}">📋 Share</button>
    <button class="btn btn-outline discussion-btn" type="button">💬 Discussion</button>
  </div>
  <div class="giscus-container" hidden></div>

  <script>
    const shareBtn = document.querySelector('.share-btn');
    if (shareBtn) {
      shareBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(shareBtn.dataset.url);
          const original = shareBtn.innerHTML;
          shareBtn.innerHTML = '✅ Copied';
          setTimeout(() => { shareBtn.innerHTML = original; }, 1500);
        } catch (e) {
          shareBtn.innerHTML = '❌ Failed';
          setTimeout(() => { shareBtn.innerHTML = '📋 Share'; }, 1500);
        }
      });
    }

    const discBtn = document.querySelector('.discussion-btn');
    const container = document.querySelector('.giscus-container');
    if (discBtn && container) {
      discBtn.addEventListener('click', () => {
        if (container.hasAttribute('hidden')) {
          if (!container.dataset.loaded) {
            discBtn.textContent = 'Loading…';
            const script = document.createElement('script');
            script.src = 'https://giscus.app/client.js';
            script.setAttribute('data-repo', '{{ site.data.giscus.repo | default: "TheWhiteWitchTM/whitewitch" }}');
            script.setAttribute('data-repo-id', '{{ site.data.giscus.repo_id }}');
            script.setAttribute('data-category', '{{ site.data.giscus.category }}');
            script.setAttribute('data-category-id', '{{ site.data.giscus.category_id }}');
            script.setAttribute('data-mapping', 'pathname');
            script.setAttribute('data-theme', 'dark');
            script.setAttribute('data-lang', 'en');
            script.crossOrigin = 'anonymous';
            script.async = true;
            container.appendChild(script);
            container.dataset.loaded = 'true';
          }
          container.removeAttribute('hidden');
          discBtn.innerHTML = '💬 Discussion off';
        } else {
          container.setAttribute('hidden', '');
          discBtn.innerHTML = '💬 Discussion';
        }
      });
    }
  </script>
{% endif %}
