<script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
<script>anchors.add();</script>

<script>
  // Dropdown toggles
  const uaMark = document.getElementById('ua-mark');
  const uaMenu = document.getElementById('ua-menu');
  const uaWrap = uaMark ? uaMark.parentElement : null;

  function setUkraine(open) {
    if (!uaWrap || !uaMark || !uaMenu) return;
    uaWrap.classList.toggle('is-open', open);
    uaMark.setAttribute('aria-expanded', open ? 'true' : 'false');
    uaMenu.setAttribute('aria-hidden', open ? 'false' : 'true');
  }

  document.querySelectorAll('.dropdown-toggle').forEach(toggle => {
    toggle.addEventListener('click', function(e) {
      e.preventDefault();
      const menu = this.nextElementSibling;
      const isOpen = menu.classList.contains('open');
      document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
      setUkraine(false);
      if (!isOpen) menu.classList.add('open');
    });
  });

  if (uaMark) {
    uaMark.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const open = uaWrap.classList.contains('is-open');
      document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
      setUkraine(!open);
    });
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.dropdown')) {
      document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
    }
    if (!e.target.closest('.ua-wrap')) setUkraine(false);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') setUkraine(false);
  });

  // Hamburger
  const navToggle = document.querySelector('.nav-toggle');
  const navMenu = document.querySelector('.site-nav > ul');
  if (navToggle && navMenu) {
    navToggle.addEventListener('click', () => {
      const isOpen = navMenu.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', isOpen);
      if (isOpen) setUkraine(false);
    });
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    var scope = '{{ "/" | relative_url }}';
    if (scope.slice(-1) !== '/') scope += '/';
    navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}', {
      scope: scope,
      updateViaCache: 'none'
    }).catch(function () {});
  }
</script>
