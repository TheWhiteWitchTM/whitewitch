<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaxy Hunt</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    body { padding: 1rem; background: #0a0a0a; color: #e8e8e8; font-family: monospace; }
    #output { width: 100%; max-width: 720px; height: 420px; background: #111; color: #c9a6ff; border: 1px solid #2a2a2a; border-radius: 6px; padding: 0.5rem; font-size: 0.95rem; }
    #command-form { margin-top: 0.5rem; display: flex; gap: 0.5rem; max-width: 720px; }
    #command { flex: 1; background: #111; color: #e8e8e8; border: 1px solid #2a2a2a; border-radius: 6px; padding: 0.4rem 0.6rem; }
    button { background: #6b4c8a; color: #fff; border: none; border-radius: 6px; padding: 0.4rem 1rem; cursor: pointer; }
    button:hover { background: #8a6cb0; }
  </style>
</head>
<body>
  <h1>🚀 Galaxy Hunt</h1>
  <textarea id="output" readonly></textarea>
  <form id="command-form">
    <input id="command" autocomplete="off" autofocus placeholder="Command (nav, scan, fire, help…)">
    <button type="submit">Enter</button>
  </form>
  <script src="galaxy-hunt.js"></script>
</body>
</html>
